<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exampage</title>
    <link rel="stylesheet" href="exampage.css">
    
</head>
<body>
    <div class="exam-container">
    <header class="exam-header">
        <div class="exam-title">Python Programming - Midterm</div>
        <div class="timer">Time Left: <span id="time">59:57</span></div>
    </header>

    <div class="main-layout">
        <div class="question-section">

            <!--  UPDATED PART -->
            <div class="question-card">
                <div id="questions"></div>
            </div>

            <div class="nav-buttons">
                <button type="button" class="btn-prev">Previous</button>
<button type="button" class="btn-next">Next</button>
<button type="button" class="btn-submit">Submit Exam</button>
            </div>
        </div>

        <aside class="exam-sidebar">
          <div class="webcam-box">
    <video id="webcam" autoplay playsinline></video>
</div>
           <div class="grid" id="palette"></div>
            </div>
        </aside>
    </div>
    
    <div id="resultOverlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background-color:rgba(0,0,0,0.5); z-index:999;"></div>
    
    <div id="resultBox" style="display:none; text-align:center; margin-top:20px; padding: 40px;">
        <h2>Exam Finished</h2>
        <p id="scoreText">Processing your results...</p>
        <p id="submitStatus" style="font-size: 0.9rem; color: #999; margin-top: 20px;"></p>
        <button id="continueBtn" class="btn-continue" style="margin-top: 30px;">Continue</button>
    </div>
</div>
<script src="exampage.js"></script>
</body>
</html>
